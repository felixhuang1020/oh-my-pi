[project]
name = "pi-agent-core"
version = "0.1.0"
description = "Python port of @earendil-works/pi-agent-core"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pi-ai",
    # proxy.py builds its transport through pi_ai.utils.http, so httpx is a core
    # requirement rather than an optional extra.
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_agent"]

[tool.uv.sources]
pi-ai = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

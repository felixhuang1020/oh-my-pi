[project]
name = "pi-ai"
version = "0.1.0"
description = "Python port of @earendil-works/pi-ai"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
]

[project.optional-dependencies]
# Vertex uses Application Default Credentials when no explicit token is supplied.
# Without this extra the vertex adapter still runs on `GOOGLE_ACCESS_TOKEN`, and the
# ADC path is encoded into the stream as a clear error instead of raising.
vertex = ["google-auth>=2.40.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pi_ai"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

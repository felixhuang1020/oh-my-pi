[project]
name = "oh-my-pi"
version = "0.1.0"
description = "Python port of the pi ai and agent packages"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pi-ai",
    "pi-agent-core",
]

[tool.uv.workspace]
members = [
    "packages/ai",
    "packages/agent",
]

[tool.uv.sources]
pi-ai = { workspace = true }
pi-agent-core = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "packages/ai/tests",
    "packages/agent/tests",
]
